[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastsafetensors-perf"
version = "0.2.0"
description = "Performance and regression benchmark for fastsafetensors ParallelLoader"
authors = [{ name = "Takeshi Yoshimura", email = "tyos@jp.ibm.com" }]
requires-python = ">=3.10,<3.15"
dependencies = [
    "fastsafetensors>=0.3.3",
    "safetensors>=0.4.0",
    "typer>=0.9.0",
]

# vLLM is only needed for the `vllm` and `vllm-model-load` modes. It pins the
# whole result baseline series, so keep it as an opt-in extra rather than a hard
# dependency of the CPU-only unit tests and `inspect`/`parallel`/`safetensors`
# paths.
[project.optional-dependencies]
vllm = ["vllm[fastsafetensors]==0.25.1"]
test = ["pytest>=7.0.0"]

[project.scripts]
fastsafetensors-perf = "fastsafetensors_perf.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["fastsafetensors_perf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
